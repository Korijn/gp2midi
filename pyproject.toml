[project]
name = "gp2midi"
version = "0.1.0"
description = "Export Guitar Pro drum tracks to General MIDI with dynamics, accents and ghost notes as velocities"
readme = "README.md"
authors = [
    { name = "Korijn van Golen", email = "korijn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3.3",
]

[project.scripts]
gp2midi = "gp2midi:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]

